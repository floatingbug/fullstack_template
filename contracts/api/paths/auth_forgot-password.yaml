post:
  tags:
    - Auth
  operationId: forgotPassword
  security: []
  summary: Request a password reset
  description: |
    Always responds generically so the endpoint does not reveal whether an
    account exists. Mail errors are logged and do not change the response.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/EmailRequest.yaml
  responses:
    '200':
      description: Request accepted; a reset link was sent if applicable.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Message.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
