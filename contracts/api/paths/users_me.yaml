get:
  tags:
    - Users
  operationId: getCurrentUser
  summary: Get the current user
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Current user.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/User.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      description: The authenticated user no longer exists.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
delete:
  tags:
    - Users
  operationId: deleteCurrentUser
  summary: Delete the current account
  description: Deletes the account and clears the refresh token cookie.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Account deleted.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Message.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      description: The account could not be deleted because it no longer exists.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
