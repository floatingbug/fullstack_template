openapi: 3.1.0

info:
  title: Fullstack Template API
  version: 1.0.0
  license:
    name: ISC
    identifier: ISC
  description: |
    HTTP API for authentication, users and account management.

    All request and response bodies are JSON unless stated otherwise. Errors
    normally use `{ "message": "..." }`. `PATCH /account` uses `{ "error": ... }`
    for input validation failures.

    Unknown routes return `404 { "message": "Not found" }`. Unexpected errors
    return `500 { "message": "Internal server error" }`.

servers:
  - url: http://localhost:3000
    description: Local development backend

tags:
  - name: Auth
    description: Registration, sign-in, sign-out, token refresh and email/password flows.
  - name: Users
    description: Current user and public user lookup.
  - name: Account
    description: Account updates and email-change confirmation.

paths:
  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      security: []
      summary: Create an account
      description: |
        Creates a user and sends a verification email. In development without
        SMTP configuration the verification link is written to the backend log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created; verification email requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Name or email address is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: The verification email could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      security: []
      summary: Sign in
      description: |
        Returns an access token in the JSON body and sets the HttpOnly refresh
        token cookie. The refresh token is never returned in the JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in successfully.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The email address has not been verified yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Sign out
      description: |
        Requires a valid access token and clears the refresh token cookie.
        The response has no body.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Signed out; refresh cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Refresh the access token
      description: |
        Reads the HttpOnly `refreshToken` cookie and returns a new access token.
        The refresh cookie is not rotated.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh token missing, invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/verify-email:
    get:
      tags: [Auth]
      operationId: verifyEmail
      security: []
      summary: Verify an email address
      description: |
        Verifies the email address using the token from the verification email.
        Opening the same valid link again returns 200 if the address is already
        verified.
      parameters:
        - $ref: '#/components/parameters/TokenQuery'
      responses:
        '200':
          description: Email address verified (or already verified).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerificationEmail
      security: []
      summary: Resend the verification email
      description: |
        Always responds generically so the endpoint does not reveal whether an
        account exists. A mail delivery failure returns 502.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Request accepted; a verification email was sent if applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: The verification email could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security: []
      summary: Request a password reset
      description: |
        Always responds generically so the endpoint does not reveal whether an
        account exists. Mail errors are logged and do not change the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Request accepted; a reset link was sent if applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      summary: Set a new password
      description: |
        Consumes the password reset token and replaces the password. Passwords
        are never trimmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The authenticated user no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      operationId: deleteCurrentUser
      summary: Delete the current account
      description: Deletes the account and clears the refresh token cookie.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The account could not be deleted because it no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /account:
    patch:
      tags: [Account]
      operationId: updateAccount
      summary: Update name, email or password
      description: |
        Changes one or more fields. Business conflicts such as a taken name or
        email, an identical value, or an identical email are reported in the
        `errorMessages` object with HTTP 200. Input validation failures use
        HTTP 400 with `{ "error": ... }`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Update processed; inspect `messages` and `errorMessages`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResult'
        '400':
          description: Invalid input; the body contains an `error` field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /account/confirm-email:
    get:
      tags: [Account]
      operationId: confirmEmailChange
      security: []
      summary: Confirm an email change
      description: |
        Confirms a pending email change using the token from the confirmation
        email. The endpoint itself does not require authentication.
      parameters:
        - $ref: '#/components/parameters/TokenQuery'
      responses:
        '200':
          description: Email address changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmEmailChangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The new email address is already in use by another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /auth/sign-in` or `POST /auth/refresh`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: |
        HttpOnly refresh token cookie. Path `/auth/refresh`; `SameSite=Lax` in
        development and `SameSite=None; Secure` in production.

  parameters:
    TokenQuery:
      name: token
      in: query
      required: false
      description: |
        Token from the email link. Required in practice; if missing, the
        endpoint responds with 400.
      schema:
        type: string

  headers:
    SetCookie:
      description: |
        Cookie header for the refresh token. Sign-in sets it; sign-out clears it.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded (only active in production).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Message:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string

    Error:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string

    AccountValidationError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              required: [type, message]
              additionalProperties: false
              properties:
                type:
                  type: string
                message:
                  type: string

    User:
      type: object
      required: [id, name, email]
      additionalProperties: false
      description: |
        Public user data. `name` and `email` are personal data.
      properties:
        id:
          type: string
          description: MongoDB ObjectId serialized as a hex string.
        name:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          description: Normalized email address.

    SignInResponse:
      type: object
      required: [user, accessToken]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: 'JWT access token for the `Authorization: Bearer` header.'

    RefreshResponse:
      type: object
      required: [accessToken]
      additionalProperties: false
      properties:
        accessToken:
          type: string

    AccountUpdateResult:
      type: object
      required: [messages, errorMessages, updated]
      additionalProperties: false
      properties:
        messages:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
            password:
              type: string
        errorMessages:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
            password:
              type: string
        updated:
          type: array
          items:
            type: string
            enum: [name, email, password]

    ConfirmEmailChangeResponse:
      type: object
      required: [success, newEmail, message]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
        newEmail:
          type: [string, 'null']
        message:
          type: string

    SignUpRequest:
      type: object
      required: [name, email, password]
      additionalProperties: true
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9._-]+$'
          description: Trimmed display name.
        email:
          type: string
          description: Email address; normalized to lowercase.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Must contain uppercase and lowercase letters and at least one
            number. Never trimmed.

    SignInRequest:
      type: object
      required: [nameOrEmail, password]
      additionalProperties: true
      properties:
        nameOrEmail:
          type: string
          description: Email address or display name.
        password:
          type: string

    EmailRequest:
      type: object
      required: [email]
      additionalProperties: true
      properties:
        email:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, password]
      additionalProperties: true
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Must contain uppercase and lowercase letters and at least one
            number. Never trimmed.

    AccountUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        At least one of `name`, `email` or `password` is required. Unknown
        fields are rejected by the existing account validation middleware.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9._-]+$'
        email:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Must contain uppercase and lowercase letters and at least one
            number. Never trimmed.
